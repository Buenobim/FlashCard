<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula 03 — Funções Inorgânicas | Química Geral e Experimental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   PALETA — as mesmas cores da Plataforma Bueno (src/index.css + as esferas do
   Sub-Cerebro). Cada funcao inorganica ganhou a cor de uma esfera, para o olho
   ja saber onde esta: acido = rosa (Aula), base = azul (Anotacao),
   sal = verde (Exercicios), oxido = violeta (Caderno), NOX = ambar (Link).
   ========================================================================= */
:root{
  --bg-0:#0C0D0F; --bg-1:#15171A; --bg-2:#1E2126;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12);
  --laranja:#E8933F; --laranja-2:#E77950;
  --verde:#3ECF8E;  --vermelho:#E5484D; --amarelo:#EEA53D;
  --rosa:#F472B6;   --azul:#60A5FA;     --violeta:#A78BFA;
  --esmeralda:#34D399; --ambar:#F59E0B;
  --txt:#F4F5F7; --txt-2:#C3C9D2; --mut:#99A1AC;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --r-s:10px; --r-m:14px; --r-l:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg-0); color:var(--txt); font-family:var(--sans);
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(680px 480px at 12% -6%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(620px 520px at 92% 4%, rgba(244,114,182,.13), transparent 62%),
    radial-gradient(760px 620px at 50% 108%, rgba(232,147,63,.10), transparent 64%);
}
.wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 22px 90px}

/* ---------------------------------------------------------------- CAPA -- */
.capa{padding:52px 0 30px; text-align:center}
.selo{
  display:inline-flex; align-items:center; gap:9px; padding:7px 16px;
  border:1px solid rgba(244,114,182,.35); border-radius:999px;
  background:rgba(244,114,182,.10); color:#FBCFE8;
  font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
}
.capa h1{
  font-family:var(--serif); font-weight:700; margin:20px 0 8px;
  font-size:clamp(30px,5.4vw,54px); line-height:1.08; letter-spacing:-.02em;
  background:linear-gradient(120deg,#fff 8%,#F9C58D 52%,#F472B6 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.capa .sub{color:var(--txt-2); font-size:17px; max-width:660px; margin:0 auto}
.chips{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:24px}
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:7px 14px;
  border:1px solid var(--border-2); border-radius:999px; background:rgba(255,255,255,.04);
  font-size:12.5px; font-weight:600; color:var(--txt-2);
}
.chip b{color:var(--txt); font-weight:800}

/* -------------------------------------------------------------- SUMARIO -- */
.sumario{
  margin:34px 0 8px; padding:20px; border:1px solid var(--border);
  border-radius:var(--r-l); background:linear-gradient(180deg,rgba(30,33,38,.9),rgba(21,23,26,.72));
  backdrop-filter:blur(8px);
}
.sumario h2{margin:0 0 14px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mut)}
.sumario ol{margin:0; padding:0; list-style:none; display:grid; gap:8px;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.sumario a{
  display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:var(--r-s);
  border:1px solid transparent; color:var(--txt-2); text-decoration:none;
  font-size:14.5px; font-weight:600; transition:.18s;
}
.sumario a:hover{background:rgba(255,255,255,.05); border-color:var(--border-2); color:#fff; transform:translateX(3px)}
.sumario .num{
  flex:0 0 26px; height:26px; display:grid; place-items:center; border-radius:8px;
  background:rgba(232,147,63,.14); color:var(--laranja); font-size:12px; font-weight:800;
}

/* ------------------------------------------------------------- SECCOES -- */
section{scroll-margin-top:18px; margin-top:46px}
.sec-cab{display:flex; align-items:flex-start; gap:15px; margin-bottom:20px}
.sec-ico{
  flex:0 0 46px; height:46px; border-radius:14px; display:grid; place-items:center;
  font-size:22px; border:1px solid var(--border-2); background:rgba(255,255,255,.04);
}
.sec-cab h2{
  font-family:var(--serif); font-weight:700; margin:0; letter-spacing:-.01em;
  font-size:clamp(22px,3.2vw,30px); line-height:1.2;
}
.sec-cab p{margin:5px 0 0; color:var(--mut); font-size:14.5px}

.card{
  border:1px solid var(--border); border-radius:var(--r-m); padding:20px 22px;
  background:linear-gradient(180deg,rgba(30,33,38,.72),rgba(21,23,26,.55)); margin:16px 0;
}
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
h3{font-size:18px; margin:26px 0 10px; letter-spacing:-.01em}
h4{font-size:15px; margin:18px 0 8px; color:var(--txt)}
p{margin:0 0 12px; color:var(--txt-2)}
ul,ol{color:var(--txt-2); padding-left:22px; margin:0 0 12px}
li{margin-bottom:7px}
b,strong{color:var(--txt)}
a{color:var(--laranja)}

.tag{display:inline-block; padding:2px 9px; border-radius:6px; font-size:12px; font-weight:800; letter-spacing:.03em}
.t-acido{background:rgba(244,114,182,.16); color:#F9A8D4}
.t-base{background:rgba(96,165,250,.16); color:#93C5FD}
.t-sal{background:rgba(52,211,153,.16); color:#6EE7B7}
.t-oxido{background:rgba(167,139,250,.16); color:#C4B5FD}
.t-nox{background:rgba(245,158,11,.16); color:#FCD34D}

.f{font-family:'Menlo','Consolas',monospace; font-weight:700; color:#fff; white-space:nowrap}
.f sub{font-size:.72em; font-weight:700}
.f sup{font-size:.72em; font-weight:700}
.eq{
  font-family:'Menlo','Consolas',monospace; font-size:15px; font-weight:700; color:#fff;
  background:rgba(0,0,0,.34); border:1px solid var(--border-2); border-left:3px solid var(--laranja);
  border-radius:var(--r-s); padding:13px 16px; margin:12px 0; overflow-x:auto; line-height:2;
}
.eq small{display:block; font-family:var(--sans); font-weight:600; color:var(--mut); font-size:12.5px; margin-top:6px}

.box{border-radius:var(--r-m); padding:15px 18px; margin:16px 0; border:1px solid; font-size:14.5px}
.box .tit{display:flex; align-items:center; gap:9px; font-weight:800; margin-bottom:7px; font-size:14px; letter-spacing:.02em}
.box p:last-child{margin-bottom:0}
.b-dica{border-color:rgba(62,207,142,.3); background:rgba(62,207,142,.07)} .b-dica .tit{color:var(--verde)}
.b-atencao{border-color:rgba(238,165,61,.32); background:rgba(238,165,61,.07)} .b-atencao .tit{color:var(--amarelo)}
.b-pegadinha{border-color:rgba(229,72,77,.32); background:rgba(229,72,77,.07)} .b-pegadinha .tit{color:#F87171}
.b-prova{border-color:rgba(167,139,250,.32); background:rgba(167,139,250,.07)} .b-prova .tit{color:var(--violeta)}
.b-aula{border-color:rgba(244,114,182,.30); background:rgba(244,114,182,.06)} .b-aula .tit{color:var(--rosa)}

.tab-rol{overflow-x:auto; margin:16px 0; border:1px solid var(--border); border-radius:var(--r-m)}
table{width:100%; border-collapse:collapse; font-size:14px; min-width:480px}
thead th{
  background:rgba(255,255,255,.045); color:var(--mut); text-align:left; padding:11px 14px;
  font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:800;
  border-bottom:1px solid var(--border-2); white-space:nowrap;
}
tbody td{padding:11px 14px; border-bottom:1px solid rgba(255,255,255,.05); color:var(--txt-2); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.028)}
td .f{color:#fff}

.ph-barra{
  display:flex; height:42px; border-radius:10px; overflow:hidden; margin:8px 0 4px;
  border:1px solid var(--border-2); font-size:11px; font-weight:800;
}
.ph-barra div{flex:1; display:grid; place-items:center; color:rgba(0,0,0,.62)}
.ph-legenda{display:flex; justify-content:space-between; color:var(--mut); font-size:12px; font-weight:700}
.ph-lista{display:grid; gap:7px; margin-top:16px}
.ph-item{
  display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:12px;
  padding:9px 13px; border-radius:var(--r-s); background:rgba(255,255,255,.032);
  border:1px solid var(--border); font-size:14px;
}
.ph-val{font-family:'Menlo','Consolas',monospace; font-weight:800; font-size:15px; text-align:center;
  padding:3px 0; border-radius:6px; color:#0C0D0F}
.ph-cat{font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mut)}

.fc-grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.fc{
  position:relative; min-height:160px; cursor:pointer; perspective:1200px;
  background:none; border:0; padding:0; text-align:left; font-family:inherit;
}
.fc-int{position:relative; width:100%; height:100%; min-height:160px; transition:transform .5s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d}
.fc.virado .fc-int{transform:rotateY(180deg)}
.fc-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:1px solid var(--border-2); border-radius:var(--r-m); padding:16px 17px;
  display:flex; flex-direction:column; justify-content:center; gap:8px; overflow:auto;
}
.fc-frente{background:linear-gradient(160deg,rgba(232,147,63,.16),rgba(30,33,38,.92))}
.fc-tras{background:linear-gradient(160deg,rgba(62,207,142,.14),rgba(21,23,26,.97)); transform:rotateY(180deg)}
.fc-tema{font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--laranja)}
.fc-tras .fc-tema{color:var(--verde)}
.fc-txt{font-size:15px; font-weight:700; color:#fff; line-height:1.45}
.fc-tras .fc-txt{font-weight:600; font-size:14.5px; color:var(--txt-2)}
.fc-tras .fc-txt strong{color:#fff}
.fc-pista{font-size:11px; color:var(--mut); font-weight:600}
.fc-barra{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin:6px 0 18px}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:10px;
  border:1px solid var(--border-2); background:rgba(255,255,255,.05); color:var(--txt);
  font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.24)}
.btn-l{background:linear-gradient(135deg,#E8933F,#D96C3F); border-color:transparent; color:#170F06}

.q{border:1px solid var(--border); border-radius:var(--r-m); padding:17px 19px; margin:13px 0;
  background:linear-gradient(180deg,rgba(30,33,38,.66),rgba(21,23,26,.5))}
.q-cab{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.q-n{flex:0 0 28px; height:28px; border-radius:9px; display:grid; place-items:center;
  background:rgba(167,139,250,.16); color:var(--violeta); font-size:12.5px; font-weight:800}
.q-tema{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--mut)}
.q-enun{color:var(--txt); font-size:15px; margin:0 0 11px; font-weight:600}
.alts{list-style:none; padding:0; margin:0 0 12px; display:grid; gap:6px}
.alts li{padding:8px 12px; border-radius:8px; background:rgba(255,255,255,.03);
  border:1px solid var(--border); font-size:14px; color:var(--txt-2)}
.alts li b{color:var(--laranja); margin-right:6px}
details{border-top:1px dashed var(--border-2); padding-top:11px}
details summary{
  cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:8px;
  font-size:13px; font-weight:800; color:var(--verde); letter-spacing:.02em;
}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"\25B8"; transition:.2s}
details[open] summary::before{transform:rotate(90deg)}
details .resp{margin-top:11px; font-size:14.5px; color:var(--txt-2);
  background:rgba(62,207,142,.06); border:1px solid rgba(62,207,142,.22);
  border-radius:var(--r-s); padding:13px 15px}
details .resp b{color:#6EE7B7}

.links{display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.link{
  display:flex; gap:13px; padding:15px 16px; border:1px solid var(--border); border-radius:var(--r-m);
  background:rgba(245,158,11,.045); text-decoration:none; transition:.18s;
}
.link:hover{border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.09); transform:translateY(-2px)}
.link .ico{flex:0 0 38px; height:38px; border-radius:11px; display:grid; place-items:center;
  background:rgba(245,158,11,.14); font-size:18px}
.link .tit{color:#fff; font-weight:700; font-size:14.5px; display:block; margin-bottom:3px}
.link .desc{color:var(--mut); font-size:12.5px; display:block; line-height:1.45}

.cola{border:1px solid rgba(232,147,63,.3); background:rgba(232,147,63,.055)}
.cola-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cola-bloco{border:1px solid var(--border); border-radius:var(--r-s); padding:13px 15px; background:rgba(12,13,15,.5)}
.cola-bloco h5{margin:0 0 8px; font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--laranja)}
.cola-bloco ul{margin:0; padding-left:17px; font-size:13.5px}
.cola-bloco li{margin-bottom:5px}

footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--border); text-align:center;
  color:var(--mut); font-size:12.5px}
footer b{color:var(--txt-2)}

@media(max-width:620px){
  .wrap{padding:0 15px 70px}
  .ph-item{grid-template-columns:56px 1fr}
  .ph-cat{grid-column:1/-1}
  .sec-cab{gap:11px} .sec-ico{flex:0 0 38px; height:38px; font-size:18px}
}
@media print{
  body::before{display:none}
  .fc-int{transform:none!important}
  details .resp{display:block}
}
</style>
</head>
<body>
<div class="wrap">
