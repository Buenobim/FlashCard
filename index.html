<!doctype html>
<!-- 
  =============================================================================
  ARQUIVO: index.html
  PARA QUE SERVE: Este arquivo é a "Casca Externa" ou a "Moldura da Foto" do nosso 
  site. Ele é um arquivo HTML básico que o navegador abre primeiro. Ele possui uma 
  gaveta vazia com o identificador id="root" (raiz) e chama o arquivo "/src/main.jsx". 
  O React então entra em ação e desenha toda a nossa linda plataforma dentro dessa gaveta root!
  =============================================================================
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0D0F" />
    <title>Plataforma Bueno</title>
  </head>
  <body>
    <!-- Esta é a gaveta mágica vazia onde o React desenha todas as telas -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
